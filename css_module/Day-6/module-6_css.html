<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 6: Box Model</title>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .box {
            height: 200px;
            width: 200px;
        }

        .box1 {
            background-color: red;
            color: white;
            border: 10px solid black;
            padding: 10px;
            box-sizing: border-box;
            margin: 20px;
        }

        .box2 {
            background-color: yellow;
            padding-left: 30px;
            padding-top: 40px;
            /* padding: verticle horizontal;  */
            box-sizing: border-box;
            border: 10px solid red;
        }
    </style>

</head>
<body>

    <h1>Day 6: Box Model</h1>

    <div class="box box1">
        Box-1
    </div>

    <div class="box box2">
        Box-2 (200 X 200)
    </div>

</body>
</html>
