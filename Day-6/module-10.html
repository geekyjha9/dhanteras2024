<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 10: Forms</title>
</head>
<body>
    <h1>Module 10: Forms</h1>

    <!-- What is use of form tag (<form></form>) ?
    this tag is used for creating form's container -->


    <!-- Form : it used to collect the details from user. -->

    <!-- 
    Label: Input Feild (text, email, password, submit, dropdown, radio button,..... etc)
    Name : ..........
    Class : ..........
    Roll No.: .......... 
    Email: ........... 
    -->


    <form>
        <label for="name">Name: </label>
        <input type="text" name="fullname" placeholder="Enter Your Full Name" required >
    </form>

    <!-- textarea is used for what ??

    it is used for taking multi line input. -->

    <form>
        <label for="Feedback">Put your Feedback :</label>
        <textarea name="feedback" placeholder="Enter your feedback: " rows="5"></textarea>
    </form>

    <!-- select tag is used for what ??

    It is used for creating dropdown. -->

    <form>
        <label for="gender">Select your Gender: </label>

        <select name="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="transgender">Transgender</option>
            <option value="pata-nahi">Pata Nahi</option>
        </select>

        <button type="submit">Submit</button>
    </form>

    



    <h5>Login Form</h5>

    <form>
        <label for="username">Username Enter Karo: </label>
        <input type="text" placeholder="Enter Your Username: ">
        <br>
        <label for="username">Password Enter Karo: </label>
        <input type="password" placeholder="Enter Your Password: ">
        <label for="username">Phuto Enter Karo: </label>


        <label for="mobilenum">Mobile Number: </label>
        <input type="text">

        <input type="file">
        <button type="submit">Submit</button>
    </form>



</body>
</html>
